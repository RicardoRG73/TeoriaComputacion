<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="6.1 Orden estricto para obtener una Gramática Bien Formada">
  <defs>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B94A3E"/>
      <stop offset="65%" stop-color="#204254"/>
      <stop offset="100%" stop-color="#121B22"/>
    </linearGradient>
    <marker id="arrSteel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#204254"/>
    </marker>
    <marker id="arrBrick" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#B94A3E"/>
    </marker>
    <marker id="arrInk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#121B22"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="360" rx="12" fill="#FAF8F5" stroke="#CBD6DE" stroke-width="1.5"/>
  <rect x="0" y="0" width="960" height="6" rx="3" fill="url(#topGrad)"/>
  <text x="28" y="34" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#121B22">6.1 Orden estricto para obtener una Gramática Bien Formada</text>
  <text x="28" y="54" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" fill="#4E606D">Cada paso puede generar defectos del paso siguiente, pero nunca reintroduce los anteriores</text>
  <line x1="28" y1="64" x2="932" y2="64" stroke="#CBD6DE" stroke-width="1"/>
<rect x="40" y="96" width="185" height="76" rx="9" fill="#FDF4F2" stroke="#B94A3E" stroke-width="2"/>
  <text x="132.5" y="130.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">Paso 1: Quitar λ</text>
  <text x="132.5" y="147.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Calcular ANUL</text>
  <line x1="225" y1="134" x2="265" y2="134" stroke="#B94A3E" stroke-width="2.2" marker-end="url(#arrBrick)"/>
  <rect x="268" y="96" width="205" height="76" rx="9" fill="#EEF3F6" stroke="#204254" stroke-width="2"/>
  <text x="370.5" y="130.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">Paso 2: Quitar unitarias</text>
  <text x="370.5" y="147.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Calcular UNIT(A)</text>
  <line x1="473" y1="134" x2="513" y2="134" stroke="#B94A3E" stroke-width="2.2" marker-end="url(#arrBrick)"/>
  <rect x="516" y="96" width="185" height="76" rx="9" fill="#EEF3F6" stroke="#204254" stroke-width="2"/>
  <text x="608.5" y="130.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">Paso 3a: TERM</text>
  <text x="608.5" y="147.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Quitar no terminables</text>
  <line x1="701" y1="134" x2="738" y2="134" stroke="#B94A3E" stroke-width="2.2" marker-end="url(#arrBrick)"/>
  <rect x="741" y="96" width="180" height="76" rx="9" fill="#204254" stroke="#121B22" stroke-width="2"/>
  <text x="831.0" y="130.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Paso 3b: ALC</text>
  <text x="831.0" y="147.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#DCE7EE">Quitar inalcanzables</text>
  <rect x="40" y="208" width="425" height="110" rx="9" fill="#FFFFFF" stroke="#CBD6DE" stroke-width="2"/>
  <text x="252.5" y="243.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">¿Por qué 1 → 2 → 3?</text>
  <text x="252.5" y="260.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">• Quitar λ crea unitarias (A→BC, C→λ ⇒ A→B)</text>
  <text x="252.5" y="277.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">• Quitar unitarias puede aislar variables</text>
  <text x="252.5" y="294.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">• Quitar inútiles al final nunca crea λ ni unitarias</text>
  <rect x="495" y="208" width="425" height="110" rx="9" fill="#FDF4F2" stroke="#B94A3E" stroke-width="2"/>
  <text x="707.5" y="243.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">¿Por qué TERM antes que ALC?</text>
  <text x="707.5" y="260.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Ejemplo: S → a | AB,  A → aA | λ</text>
  <text x="707.5" y="277.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Si haces ALC primero, B mantiene viva a A;</text>
  <text x="707.5" y="294.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">al quitar luego B, A queda inalcanzable.</text>
</svg>
