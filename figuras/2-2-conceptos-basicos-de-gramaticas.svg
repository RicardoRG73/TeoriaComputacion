  <text x="142.5" y="178.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">≥ 1 variable de V</text>
  <line x1="220" y1="165" x2="275" y2="165" stroke="#B94A3E" stroke-width="2.2" marker-end="url(#arrBrick)"/>
  <rect x="217.7" y="145.0" width="59.6" height="17" rx="4" fill="#FAF8F5" fill-opacity="0.92"/>
  <text x="247.5" y="157.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#B94A3E">produce</text>
  <rect x="280" y="134" width="155" height="62" rx="9" fill="#EEF3F6" stroke="#204254" stroke-width="2"/>
