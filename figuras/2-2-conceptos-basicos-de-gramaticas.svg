  <text x="28" y="34" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#121B22">2.2 Anatomía de una producción y tránsito de formas sentenciales a sentencias</text>
  <text x="28" y="54" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" fill="#4E606D">Vocabulario total (V ∪ Σ) con V ∩ Σ = ∅</text>
  <line x1="28" y1="64" x2="932" y2="64" stroke="#CBD6DE" stroke-width="1"/>
<rect x="40" y="88" width="420" height="238" rx="10" fill="#FFFFFF" stroke="#204254" stroke-width="1.8"/>
  <text x="250" y="114" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#204254">Anatomía de una regla de producción</text>
  <rect x="65" y="134" width="155" height="62" rx="9" fill="#FDF4F2" stroke="#B94A3E" stroke-width="2"/>
