  <text x="357.5" y="178.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">β ∈ (V ∪ Σ)*</text>
  <text x="250" y="232" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#121B22">Ejemplo BNF:  &lt;id&gt; → &lt;letra&gt;&lt;resto&gt;</text>
  <text x="250" y="258" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#4E606D">Variables V: se siguen expandiendo</text>
