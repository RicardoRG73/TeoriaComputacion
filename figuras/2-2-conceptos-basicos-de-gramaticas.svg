  <text x="705.0" y="300.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Sentencias w ∈ Σ* (sin variables)</text>
