  <line x1="705" y1="174" x2="705" y2="198" stroke="#B94A3E" stroke-width="2.2" marker-end="url(#arrBrick)"/>
  <rect x="550" y="200" width="310" height="48" rx="9" fill="#FFFFFF" stroke="#CBD6DE" stroke-width="2"/>
  <text x="705.0" y="220.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">Formas sentenciales ∈ (V ∪ Σ)*</text>
  <text x="705.0" y="237.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Pueden mezclar variables y terminales</text>
