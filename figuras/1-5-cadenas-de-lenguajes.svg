<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="1.5 Distinción fundamental: ∅, λ, {λ}, {∅} y universos Σ*, Σ+">
  <defs>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B94A3E"/>
      <stop offset="65%" stop-color="#204254"/>
      <stop offset="100%" stop-color="#121B22"/>
    </linearGradient>
    <marker id="arrSteel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#204254"/>
    </marker>
    <marker id="arrBrick" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#B94A3E"/>
    </marker>
    <marker id="arrInk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#121B22"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="360" rx="12" fill="#FAF8F5" stroke="#CBD6DE" stroke-width="1.5"/>
  <rect x="0" y="0" width="960" height="6" rx="3" fill="url(#topGrad)"/>
  <text x="28" y="34" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#121B22">1.5 Distinción fundamental: ∅, λ, {λ}, {∅} y universos Σ*, Σ+</text>
  <text x="28" y="54" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" fill="#4E606D">No confundir una cadena sin símbolos (λ) con un conjunto sin cadenas (∅)</text>
  <line x1="28" y1="64" x2="932" y2="64" stroke="#CBD6DE" stroke-width="1"/>
<rect x="40" y="88" width="195" height="100" rx="9" fill="#FFFFFF" stroke="#CBD6DE" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="137.5" y="134.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">∅ (Lenguaje vacío)</text>
  <text x="137.5" y="151.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Conjunto con 0 cadenas</text>
  <rect x="265" y="88" width="195" height="100" rx="9" fill="#FDF4F2" stroke="#B94A3E" stroke-width="2"/>
  <text x="362.5" y="134.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">λ (Cadena vacía)</text>
  <text x="362.5" y="151.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Secuencia de longitud 0</text>
  <rect x="490" y="88" width="195" height="100" rx="9" fill="#EEF3F6" stroke="#204254" stroke-width="2"/>
  <text x="587.5" y="134.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">{λ} (Unitario)</text>
  <text x="587.5" y="151.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Conjunto con 1 cadena: λ</text>
  <rect x="715" y="88" width="205" height="100" rx="9" fill="#FFFFFF" stroke="#CBD6DE" stroke-width="2"/>
  <text x="817.5" y="134.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">{∅} (Familia)</text>
  <text x="817.5" y="151.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Conjunto cuyo elemento es ∅</text>
  <rect x="40" y="210" width="880" height="122" rx="10" fill="#EEF3F6" stroke="#204254" stroke-width="2"/>
  <text x="480" y="235" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#204254">Universo Σ* = {λ} ∪ Σ+   (Infinito numerable, ejemplo Σ = {a, b})</text>
  <rect x="70" y="250" width="150" height="62" rx="9" fill="#FDF4F2" stroke="#B94A3E" stroke-width="2"/>
  <text x="145.0" y="277.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">{λ} (long. 0)</text>
  <text x="145.0" y="294.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">|λ| = 0</text>
  <rect x="245" y="250" width="645" height="62" rx="9" fill="#FFFFFF" stroke="#CBD6DE" stroke-width="2"/>
  <text x="567.5" y="277.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">Σ+ = Σ* - {λ}   (Cadenas no vacías: longitud ≥ 1)</text>
  <text x="567.5" y="294.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">a, b  |  aa, ab, ba, bb  |  aaa, aab, aba, ...</text>
</svg>
