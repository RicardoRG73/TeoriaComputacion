  <text x="395" y="180" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#121B22">y</text>
  <circle cx="175" cy="255" r="18" fill="#FDF4F2" stroke="#B94A3E" stroke-width="2.2"/>
  <circle cx="175" cy="255" r="13" fill="none" stroke="#B94A3E" stroke-width="1.6"/>
