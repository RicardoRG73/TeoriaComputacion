  <rect x="465" y="92" width="455" height="108" rx="9" fill="#FDF4F2" stroke="#B94A3E" stroke-width="2"/>
  <text x="692.5" y="126.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">Condiciones del bombeo (|z| &gt; n = 2^|V|)</text>
  <text x="692.5" y="143.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">1. |vwx| ≤ n    (subárbol superior acotado)</text>
  <text x="692.5" y="160.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">2. |vx| ≥ 1      (v o x no vacía)</text>
  <text x="692.5" y="177.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">3. uvⁱwxⁱy ∈ L   para todo i ≥ 0</text>
  <rect x="465" y="214" width="455" height="108" rx="9" fill="#204254" stroke="#121B22" stroke-width="2"/>
  <text x="692.5" y="256.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">No son LIC (contraejemplos clásicos)</text>
  <text x="692.5" y="273.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#DCE7EE">• {aⁿbⁿcⁿ}  • {ww | w ∈ {a,b}*}  • {aⁱbʲcᵏ | i ≤ j ≤ k}</text>
  <text x="692.5" y="290.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#DCE7EE">Además, los LIC NO son cerrados bajo ∩ ni complemento</text>
</svg>
