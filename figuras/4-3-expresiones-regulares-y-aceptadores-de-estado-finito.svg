  <text x="28" y="54" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" fill="#4E606D">Bloques modulares unidos por λ-transiciones y reducción algebraica R&#x27;ᵢⱼ = Rᵢⱼ + Rᵢₖ(Rₖₖ)*Rₖⱼ</text>
