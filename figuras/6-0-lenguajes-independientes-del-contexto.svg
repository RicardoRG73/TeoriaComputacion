<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="Unidad 6 · Ruta de simplificación y normalización de una GIC">
  <defs>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B94A3E"/>
      <stop offset="65%" stop-color="#204254"/>
      <stop offset="100%" stop-color="#121B22"/>
    </linearGradient>
    <marker id="arrSteel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#204254"/>
    </marker>
    <marker id="arrBrick" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#B94A3E"/>
    </marker>
    <marker id="arrInk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#121B22"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="360" rx="12" fill="#FAF8F5" stroke="#CBD6DE" stroke-width="1.5"/>
  <rect x="0" y="0" width="960" height="6" rx="3" fill="url(#topGrad)"/>
  <text x="28" y="34" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#121B22">Unidad 6 · Ruta de simplificación y normalización de una GIC</text>
  <text x="28" y="54" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" fill="#4E606D">De una gramática arbitraria a las formas canónicas de Chomsky (FNC) y Greibach (FNG)</text>
  <line x1="28" y1="64" x2="932" y2="64" stroke="#CBD6DE" stroke-width="1"/>
<rect x="38" y="102" width="170" height="66" rx="9" fill="#FFFFFF" stroke="#CBD6DE" stroke-width="2"/>
  <text x="123.0" y="131.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">GIC arbitraria G</text>
  <text x="123.0" y="148.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Con defectos</text>
  <line x1="208" y1="135" x2="240" y2="135" stroke="#B94A3E" stroke-width="2.2" marker-end="url(#arrBrick)"/>
  <rect x="244" y="102" width="210" height="66" rx="9" fill="#EEF3F6" stroke="#204254" stroke-width="2"/>
  <text x="349.0" y="131.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">6.1 Gramática Bien Formada</text>
  <text x="349.0" y="148.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Sin λ, unitarias ni inútiles</text>
  <line x1="454" y1="135" x2="505" y2="112" stroke="#B94A3E" stroke-width="2.2" marker-end="url(#arrBrick)"/>
  <line x1="454" y1="135" x2="505" y2="162" stroke="#204254" stroke-width="2.2" marker-end="url(#arrSteel)"/>
  <rect x="510" y="82" width="200" height="50" rx="9" fill="#FDF4F2" stroke="#B94A3E" stroke-width="2"/>
  <text x="610.0" y="103.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">6.2 FNC: A → BC | a</text>
  <text x="610.0" y="120.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Árbol binario / CYK</text>
  <rect x="510" y="146" width="200" height="50" rx="9" fill="#EEF3F6" stroke="#204254" stroke-width="2"/>
  <text x="610.0" y="167.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">6.2 FNG: A → aα</text>
  <text x="610.0" y="184.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Sin recursividad izq.</text>
  <line x1="710" y1="107" x2="745" y2="135" stroke="#B94A3E" stroke-width="2.2" marker-end="url(#arrBrick)"/>
  <line x1="710" y1="171" x2="745" y2="145" stroke="#204254" stroke-width="2.2" marker-end="url(#arrSteel)"/>
  <rect x="748" y="102" width="175" height="66" rx="9" fill="#204254" stroke="#121B22" stroke-width="2"/>
  <text x="835.5" y="131.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">6.3 Estructura LIC</text>
  <text x="835.5" y="148.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#DCE7EE">Bombeo, clausura, decisión</text>
  <rect x="80" y="224" width="800" height="88" rx="9" fill="#FDF4F2" stroke="#B94A3E" stroke-width="2"/>
  <text x="480.0" y="264.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">Orden estricto de limpieza (6.1.5)</text>
  <text x="480.0" y="281.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">1. Eliminar producciones-λ (ANUL)  →  2. Eliminar unitarias (UNIT)  →  3. Eliminar inútiles (TERM → ALC)</text>
</svg>
