<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="4.4 Lema de bombeo regular (w = uvx) y autómata producto">
  <defs>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B94A3E"/>
      <stop offset="65%" stop-color="#204254"/>
      <stop offset="100%" stop-color="#121B22"/>
    </linearGradient>
    <marker id="arrSteel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#204254"/>
    </marker>
    <marker id="arrBrick" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#B94A3E"/>
    </marker>
    <marker id="arrInk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#121B22"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="360" rx="12" fill="#FAF8F5" stroke="#CBD6DE" stroke-width="1.5"/>
  <rect x="0" y="0" width="960" height="6" rx="3" fill="url(#topGrad)"/>
  <text x="28" y="34" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#121B22">4.4 Lema de bombeo regular (w = uvx) y autómata producto</text>
  <text x="28" y="54" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" fill="#4E606D">Todo camino suficientemente largo (|w| ≥ n) repite un estado q formando un ciclo v bombeable</text>
  <line x1="28" y1="64" x2="932" y2="64" stroke="#CBD6DE" stroke-width="1"/>
<rect x="38" y="86" width="510" height="242" rx="10" fill="#FFFFFF" stroke="#B94A3E" stroke-width="2"/>
  <text x="293" y="112" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#B94A3E">Lema de bombeo: descomposición w = u · v · x</text>
  <line x1="52" y1="205" x2="83" y2="205" stroke="#B94A3E" stroke-width="2.2" marker-end="url(#arrBrick)"/>
  <circle cx="110" cy="205" r="24" fill="#EEF3F6" stroke="#204254" stroke-width="2.2"/>
  <text x="110" y="210" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#121B22">q₀</text>
  <circle cx="270" cy="205" r="26" fill="#FDF4F2" stroke="#B94A3E" stroke-width="2.2"/>
  <text x="270" y="203" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">q</text>
  <text x="270" y="219" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#4E606D">repetido</text>
  <circle cx="455" cy="205" r="24" fill="#FDF4F2" stroke="#B94A3E" stroke-width="2.2"/>
  <circle cx="455" cy="205" r="19" fill="none" stroke="#B94A3E" stroke-width="1.6"/>
  <text x="455" y="203" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">p_f</text>
  <text x="455" y="219" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#4E606D">∈ F</text>
  <line x1="134" y1="205" x2="241" y2="205" stroke="#204254" stroke-width="2.2" marker-end="url(#arrSteel)"/>
  <rect x="178.1" y="185.0" width="18.8" height="17" rx="4" fill="#FAF8F5" fill-opacity="0.92"/>
  <text x="187.5" y="197.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#204254">u</text>
  <line x1="296" y1="205" x2="428" y2="205" stroke="#204254" stroke-width="2.2" marker-end="url(#arrSteel)"/>
  <rect x="352.6" y="185.0" width="18.8" height="17" rx="4" fill="#FAF8F5" fill-opacity="0.92"/>
  <text x="362.0" y="197.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#204254">x</text>
  <path d="M 255 180 Q 270 125 285 180" fill="none" stroke="#B94A3E" stroke-width="2.2" marker-end="url(#arrBrick)"/>
  <rect x="190.2" y="120" width="159.6" height="17" rx="4" fill="#FAF8F5" fill-opacity="0.92"/>
  <text x="270" y="132" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#B94A3E">v  (|v| ≥ 1, |uv| ≤ n)</text>
  <text x="293" y="272" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#121B22">Entonces u vⁱ x ∈ L para todo i = 0, 1, 2, ...</text>
  <text x="293" y="298" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#4E606D">Ejemplo: en {a^n b^n}, bombear v = a^s rompe #a = #b</text>
  <rect x="572" y="86" width="350" height="242" rx="10" fill="#FFFFFF" stroke="#204254" stroke-width="1.8"/>
  <text x="747" y="112" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#204254">Autómata producto M₁ × M₂</text>
  <rect x="598" y="136" width="298" height="52" rx="9" fill="#EEF3F6" stroke="#204254" stroke-width="2"/>
  <text x="747.0" y="158.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">Estados: Q₁ × Q₂</text>
  <text x="747.0" y="175.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Simula M₁ y M₂ en paralelo</text>
  <rect x="598" y="202" width="298" height="104" rx="9" fill="#FFFFFF" stroke="#CBD6DE" stroke-width="2"/>
  <text x="747.0" y="234.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">Elige F según operación:</text>
  <text x="747.0" y="251.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">• Intersección: F₁ × F₂</text>
  <text x="747.0" y="268.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">• Diferencia: F₁ × (Q₂ - F₂)</text>
  <text x="747.0" y="285.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">• Unión: (F₁×Q₂) ∪ (Q₁×F₂)</text>
</svg>
