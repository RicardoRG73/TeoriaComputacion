<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="1.4 Tres enfoques para operar con lenguajes formales">
  <defs>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B94A3E"/>
      <stop offset="65%" stop-color="#204254"/>
      <stop offset="100%" stop-color="#121B22"/>
    </linearGradient>
    <marker id="arrSteel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#204254"/>
    </marker>
    <marker id="arrBrick" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#B94A3E"/>
    </marker>
    <marker id="arrInk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#121B22"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="360" rx="12" fill="#FAF8F5" stroke="#CBD6DE" stroke-width="1.5"/>
  <rect x="0" y="0" width="960" height="6" rx="3" fill="url(#topGrad)"/>
  <text x="28" y="34" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#121B22">1.4 Tres enfoques para operar con lenguajes formales</text>
  <text x="28" y="54" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" fill="#4E606D">Aceptador (decide pertenencia), Generador (construye cadenas) y Traductor (transforma entradas)</text>
  <line x1="28" y1="64" x2="932" y2="64" stroke="#CBD6DE" stroke-width="1"/>
<rect x="35" y="84" width="275" height="245" rx="10" fill="#FFFFFF" stroke="#204254" stroke-width="1.8"/>
  <rect x="55" y="96" width="120" height="22" rx="11" fill="#204254"/><text x="115.0" y="111" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">1. ACEPTADOR</text>
  <text x="172" y="140" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#121B22">Entrada: w ∈ Σ*</text>
  <line x1="172" y1="148" x2="172" y2="178" stroke="#204254" stroke-width="2.2" marker-end="url(#arrSteel)"/>
  <rect x="70" y="182" width="205" height="52" rx="9" fill="#EEF3F6" stroke="#204254" stroke-width="2"/>
  <text x="172.5" y="204.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">Autómata M</text>
  <text x="172.5" y="221.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">f_M : Σ* → {0, 1}</text>
  <line x1="125" y1="234" x2="105" y2="268" stroke="#B94A3E" stroke-width="2.2" marker-end="url(#arrBrick)"/>
  <line x1="220" y1="234" x2="240" y2="268" stroke="#204254" stroke-width="2.2" marker-end="url(#arrSteel)"/>
  <text x="100" y="290" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#B94A3E">1 (Acepta)</text>
  <text x="240" y="290" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#204254">0 (Rechaza)</text>
  <text x="172" y="315" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#4E606D">Ej.: AFD, AFN, AFPN</text>
  <rect x="342" y="84" width="275" height="245" rx="10" fill="#FFFFFF" stroke="#B94A3E" stroke-width="2"/>
  <rect x="362" y="96" width="125" height="22" rx="11" fill="#B94A3E"/><text x="424.5" y="111" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">2. GENERADOR</text>
  <text x="480" y="140" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#121B22">Axioma inicial S</text>
  <line x1="480" y1="148" x2="480" y2="178" stroke="#B94A3E" stroke-width="2.2" marker-end="url(#arrBrick)"/>
  <rect x="377" y="182" width="205" height="52" rx="9" fill="#FDF4F2" stroke="#B94A3E" stroke-width="2"/>
  <text x="479.5" y="204.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">Gramática G / ER</text>
  <text x="479.5" y="221.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Aplica reglas α → β</text>
  <line x1="480" y1="234" x2="480" y2="266" stroke="#B94A3E" stroke-width="2.2" marker-end="url(#arrBrick)"/>
  <text x="480" y="288" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#121B22">w₁, w₂, w₃, ... ∈ L(G)</text>
  <text x="480" y="315" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#4E606D">Ej.: Gramáticas de Chomsky</text>
  <rect x="650" y="84" width="275" height="245" rx="10" fill="#FFFFFF" stroke="#121B22" stroke-width="1.8"/>
  <rect x="670" y="96" width="125" height="22" rx="11" fill="#121B22"/><text x="732.5" y="111" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">3. TRADUCTOR</text>
  <text x="788" y="140" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#121B22">Fuente: w ∈ Σ*</text>
  <line x1="788" y1="148" x2="788" y2="178" stroke="#204254" stroke-width="2.2" marker-end="url(#arrSteel)"/>
  <rect x="685" y="182" width="205" height="52" rx="9" fill="#204254" stroke="#121B22" stroke-width="2"/>
  <text x="787.5" y="204.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Transductor T</text>
  <text x="787.5" y="221.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#DCE7EE">T : Σ* → Δ*</text>
  <line x1="788" y1="234" x2="788" y2="266" stroke="#B94A3E" stroke-width="2.2" marker-end="url(#arrBrick)"/>
  <text x="788" y="288" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#B94A3E">Destino: v = T(w) ∈ Δ*</text>
  <text x="788" y="315" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#4E606D">Ej.: Mealy, Moore, compiladores</text>
</svg>
