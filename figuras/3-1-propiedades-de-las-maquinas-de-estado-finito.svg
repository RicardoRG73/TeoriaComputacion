  <text x="28" y="54" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" fill="#4E606D">Detector de &#x27;01&#x27;: dónde se produce la salida y longitud resultante para entrada w</text>
