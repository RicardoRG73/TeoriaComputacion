<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="Unidad 3 · Máquinas de Estado Finito (MEF)">
  <defs>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B94A3E"/>
      <stop offset="65%" stop-color="#204254"/>
      <stop offset="100%" stop-color="#121B22"/>
    </linearGradient>
    <marker id="arrSteel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#204254"/>
    </marker>
    <marker id="arrBrick" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#B94A3E"/>
    </marker>
    <marker id="arrInk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#121B22"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="360" rx="12" fill="#FAF8F5" stroke="#CBD6DE" stroke-width="1.5"/>
  <rect x="0" y="0" width="960" height="6" rx="3" fill="url(#topGrad)"/>
  <text x="28" y="34" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#121B22">Unidad 3 · Máquinas de Estado Finito (MEF)</text>
  <text x="28" y="54" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" fill="#4E606D">De los modelos de Mealy y Moore a la minimización y límites de la memoria finita</text>
  <line x1="28" y1="64" x2="932" y2="64" stroke="#CBD6DE" stroke-width="1"/>
<rect x="45" y="92" width="200" height="68" rx="9" fill="#EEF3F6" stroke="#204254" stroke-width="2"/>
  <text x="145.0" y="122.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">3.1 Mealy y Moore</text>
  <text x="145.0" y="139.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Salida en arista vs. nodo</text>
  <rect x="280" y="92" width="200" height="68" rx="9" fill="#FDF4F2" stroke="#B94A3E" stroke-width="2"/>
  <text x="380.0" y="122.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">3.2 Conversión</text>
  <text x="380.0" y="139.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Moore ↔ Mealy</text>
  <rect x="515" y="92" width="200" height="68" rx="9" fill="#EEF3F6" stroke="#204254" stroke-width="2"/>
  <text x="615.0" y="122.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">3.3 Equivalencia</text>
  <text x="615.0" y="139.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">M₁ ≡ M₂ y AFN → AFD</text>
  <rect x="750" y="92" width="170" height="68" rx="9" fill="#FDF4F2" stroke="#B94A3E" stroke-width="2"/>
  <text x="835.0" y="122.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">3.4–3.5 Reducción</text>
  <text x="835.0" y="139.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Particiones y M / ≡</text>
  <line x1="245" y1="126" x2="276" y2="126" stroke="#B94A3E" stroke-width="2.2" marker-end="url(#arrBrick)"/>
  <line x1="480" y1="126" x2="511" y2="126" stroke="#B94A3E" stroke-width="2.2" marker-end="url(#arrBrick)"/>
  <line x1="715" y1="126" x2="746" y2="126" stroke="#B94A3E" stroke-width="2.2" marker-end="url(#arrBrick)"/>
  <rect x="110" y="212" width="740" height="102" rx="9" fill="#204254" stroke="#121B22" stroke-width="2"/>
  <text x="480.0" y="259.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">3.6 Historia y memoria finita</text>
  <text x="480.0" y="276.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#DCE7EE">El estado resume la historia pasada en ≤ |Q| clases; falla al contar sin límite (principio del palomar)</text>
</svg>
