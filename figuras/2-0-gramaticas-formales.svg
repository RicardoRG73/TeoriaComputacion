  <text x="140.0" y="145.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Variables V, Terminales Σ, S</text>
  <rect x="275" y="96" width="205" height="72" rx="9" fill="#FDF4F2" stroke="#B94A3E" stroke-width="2"/>
  <text x="377.5" y="128.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">2.3 Gramática Formal</text>
  <text x="377.5" y="145.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">G = (V, Σ, P, S) y L(G)</text>
  <rect x="515" y="96" width="200" height="72" rx="9" fill="#EEF3F6" stroke="#204254" stroke-width="2"/>
  <text x="615.0" y="128.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">2.4 Tipos 0, 1, 2, 3</text>
  <text x="615.0" y="145.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Jerarquía de Chomsky</text>
  <rect x="750" y="96" width="175" height="72" rx="9" fill="#FDF4F2" stroke="#B94A3E" stroke-width="2"/>
