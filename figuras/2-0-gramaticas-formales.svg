  <rect x="100" y="215" width="760" height="102" rx="9" fill="#204254" stroke="#121B22" stroke-width="2"/>
  <text x="480.0" y="262.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Cuatro niveles de potencia generativa</text>
  <text x="480.0" y="279.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#DCE7EE">L₃ (Regulares)  ⊂  L₂ (Libres del contexto)  ⊂  L₁ (Contexto sensitivo)  ⊂  L₀ (Sin restricción)</text>
