  <text x="837.5" y="145.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">⇒_lm, ⇒_rm, Ambigüedad</text>
  <line x1="240" y1="132" x2="272" y2="132" stroke="#B94A3E" stroke-width="2.2" marker-end="url(#arrBrick)"/>
