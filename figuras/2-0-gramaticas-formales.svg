  <rect x="0" y="0" width="960" height="360" rx="12" fill="#FAF8F5" stroke="#CBD6DE" stroke-width="1.5"/>
  <rect x="0" y="0" width="960" height="6" rx="3" fill="url(#topGrad)"/>
  <text x="28" y="34" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#121B22">Unidad 2 · De la representación finita a la Jerarquía de Chomsky</text>
  <text x="28" y="54" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" fill="#4E606D">Los autómatas procesan cadenas; las gramáticas generan cadenas (De Castro Korgi, 2004)</text>
  <line x1="28" y1="64" x2="932" y2="64" stroke="#CBD6DE" stroke-width="1"/>
<rect x="40" y="96" width="200" height="72" rx="9" fill="#EEF3F6" stroke="#204254" stroke-width="2"/>
