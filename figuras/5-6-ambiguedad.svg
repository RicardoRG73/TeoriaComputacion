<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="5.6 Ambigüedad en AFPN y jerarquía dentro de los LIC">
  <defs>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B94A3E"/>
      <stop offset="65%" stop-color="#204254"/>
      <stop offset="100%" stop-color="#121B22"/>
    </linearGradient>
    <marker id="arrSteel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#204254"/>
    </marker>
    <marker id="arrBrick" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#B94A3E"/>
    </marker>
    <marker id="arrInk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#121B22"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="360" rx="12" fill="#FAF8F5" stroke="#CBD6DE" stroke-width="1.5"/>
  <rect x="0" y="0" width="960" height="6" rx="3" fill="url(#topGrad)"/>
  <text x="28" y="34" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#121B22">5.6 Ambigüedad en AFPN y jerarquía dentro de los LIC</text>
  <text x="28" y="54" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" fill="#4E606D">Una GIC es ambigua ⟺ su AFPN descendente admite ≥ 2 cómputos exitosos para alguna cadena</text>
  <line x1="28" y1="64" x2="932" y2="64" stroke="#CBD6DE" stroke-width="1"/>
<rect x="38" y="86" width="430" height="240" rx="10" fill="#FFFFFF" stroke="#B94A3E" stroke-width="2"/>
  <text x="253" y="112" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#B94A3E">Dos cómputos de aceptación para 1 + 1 * 0</text>
  <rect x="58" y="134" width="125" height="52" rx="9" fill="#EEF3F6" stroke="#204254" stroke-width="2"/>
  <text x="120.5" y="156.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">(q₁, 1+1*0, Sz₀)</text>
  <text x="120.5" y="173.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Inicio en q₁</text>
  <line x1="183" y1="152" x2="240" y2="140" stroke="#204254" stroke-width="2.2" marker-end="url(#arrSteel)"/>
  <rect x="188.5" y="126.0" width="46.0" height="17" rx="4" fill="#FAF8F5" fill-opacity="0.92"/>
  <text x="211.5" y="138.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#204254">S→S+S</text>
  <line x1="183" y1="170" x2="240" y2="188" stroke="#B94A3E" stroke-width="2.2" marker-end="url(#arrBrick)"/>
  <rect x="188.5" y="159.0" width="46.0" height="17" rx="4" fill="#FAF8F5" fill-opacity="0.92"/>
  <text x="211.5" y="171.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#B94A3E">S→S*S</text>
  <rect x="245" y="118" width="205" height="42" rx="9" fill="#EEF3F6" stroke="#204254" stroke-width="2"/>
  <text x="347.5" y="135.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">Cómputo 1 (Árbol 1)</text>
  <text x="347.5" y="152.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">1 + (1 * 0) → q₂</text>
  <rect x="245" y="172" width="205" height="42" rx="9" fill="#FDF4F2" stroke="#B94A3E" stroke-width="2"/>
  <text x="347.5" y="189.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">Cómputo 2 (Árbol 2)</text>
  <text x="347.5" y="206.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">(1 + 1) * 0 → q₂</text>
  <text x="253" y="255" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#121B22">No determinismo ≠ Ambigüedad:</text>
  <text x="253" y="278" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#4E606D">Un AFPN no ambiguo puede tener ramas</text>
  <text x="253" y="298" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#4E606D">fallidas y un único cómputo ganador.</text>
  <rect x="492" y="86" width="430" height="240" rx="10" fill="#FFFFFF" stroke="#204254" stroke-width="1.8"/>
  <text x="707" y="112" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#204254">Inclusiones estrictas en los LIC</text>
  <rect x="522" y="134" width="370" height="38" rx="9" fill="#FFFFFF" stroke="#CBD6DE" stroke-width="2"/>
  <text x="707.0" y="158.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">1. Regulares (Tipo 3)</text>
  <rect x="522" y="180" width="370" height="42" rx="9" fill="#EEF3F6" stroke="#204254" stroke-width="2"/>
  <text x="707.0" y="197.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">2. LIC Deterministas: L(AFPD)</text>
  <text x="707.0" y="214.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Siempre tienen GIC no ambigua</text>
  <rect x="522" y="230" width="370" height="42" rx="9" fill="#FDF4F2" stroke="#B94A3E" stroke-width="2"/>
  <text x="707.0" y="256.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">3. LIC No Ambiguos (ej. {ww^R})</text>
  <rect x="522" y="280" width="370" height="38" rx="9" fill="#204254" stroke="#121B22" stroke-width="2"/>
  <text x="707.0" y="304.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">4. Todos los LIC (incluye inherentemente ambiguos)</text>
</svg>
