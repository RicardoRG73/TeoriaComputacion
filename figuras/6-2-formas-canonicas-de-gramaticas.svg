<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="6.2 Formas canónicas: Chomsky (FNC) + CYK vs. Greibach (FNG)">
  <defs>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B94A3E"/>
      <stop offset="65%" stop-color="#204254"/>
      <stop offset="100%" stop-color="#121B22"/>
    </linearGradient>
    <marker id="arrSteel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#204254"/>
    </marker>
    <marker id="arrBrick" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#B94A3E"/>
    </marker>
    <marker id="arrInk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#121B22"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="360" rx="12" fill="#FAF8F5" stroke="#CBD6DE" stroke-width="1.5"/>
  <rect x="0" y="0" width="960" height="6" rx="3" fill="url(#topGrad)"/>
  <text x="28" y="34" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#121B22">6.2 Formas canónicas: Chomsky (FNC) + CYK vs. Greibach (FNG)</text>
  <text x="28" y="54" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" fill="#4E606D">FNC produce árboles binarios (2n - 1 pasos); FNG produce un terminal por paso (n pasos)</text>
  <line x1="28" y1="64" x2="932" y2="64" stroke="#CBD6DE" stroke-width="1"/>
<rect x="38" y="84" width="445" height="246" rx="10" fill="#FFFFFF" stroke="#B94A3E" stroke-width="2"/>
  <text x="260" y="110" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#B94A3E">Forma Normal de Chomsky (A → BC | a) + CYK</text>
  <rect x="62" y="128" width="396" height="46" rx="9" fill="#FDF4F2" stroke="#B94A3E" stroke-width="2"/>
  <text x="260.0" y="147.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">Aislar terminales (T_a → a) y binarizar (m ≥ 3)</text>
  <text x="260.0" y="164.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">2n - 1 pasos para |w| = n</text>
  <text x="260" y="198" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#204254">Tabla dinámica CYK (w = bbab, S ∈ X₁,₄ ⇒ Acepta)</text>
  <rect x="64" y="212" width="92" height="32" rx="9" fill="#FFFFFF" stroke="#CBD6DE" stroke-width="2"/>
  <text x="110.0" y="233.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">j=1: {A}</text>
  <rect x="162" y="212" width="92" height="32" rx="9" fill="#FFFFFF" stroke="#CBD6DE" stroke-width="2"/>
  <text x="208.0" y="233.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">j=2: ∅</text>
  <rect x="260" y="212" width="92" height="32" rx="9" fill="#FFFFFF" stroke="#CBD6DE" stroke-width="2"/>
  <text x="306.0" y="233.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">j=3: {B}</text>
  <rect x="358" y="212" width="96" height="32" rx="9" fill="#B94A3E" stroke="#93362C" stroke-width="2"/>
  <text x="406.0" y="233.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">j=4: {S,C}</text>
  <rect x="64" y="250" width="92" height="32" rx="9" fill="#FFFFFF" stroke="#CBD6DE" stroke-width="2"/>
  <text x="110.0" y="271.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">{A}</text>
  <rect x="162" y="250" width="92" height="32" rx="9" fill="#FFFFFF" stroke="#CBD6DE" stroke-width="2"/>
  <text x="208.0" y="271.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">{B,S}</text>
  <rect x="260" y="250" width="92" height="32" rx="9" fill="#FFFFFF" stroke="#CBD6DE" stroke-width="2"/>
  <text x="306.0" y="271.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">{S,C}</text>
  <rect x="64" y="288" width="92" height="32" rx="9" fill="#FFFFFF" stroke="#CBD6DE" stroke-width="2"/>
  <text x="110.0" y="309.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">{B,C}</text>
  <rect x="162" y="288" width="92" height="32" rx="9" fill="#FFFFFF" stroke="#CBD6DE" stroke-width="2"/>
  <text x="208.0" y="309.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">{S,C}</text>
  <rect x="506" y="84" width="416" height="246" rx="10" fill="#FFFFFF" stroke="#204254" stroke-width="1.8"/>
  <text x="714" y="110" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#204254">Forma Normal de Greibach (A → aα)</text>
  <rect x="532" y="130" width="364" height="54" rx="9" fill="#EEF3F6" stroke="#204254" stroke-width="2"/>
  <text x="714.0" y="153.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">1. Eliminar recursividad izquierda</text>
  <text x="714.0" y="170.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">A → Aα | β  ⇒  A → β | βZ,  Z → α | αZ</text>
  <rect x="532" y="196" width="364" height="54" rx="9" fill="#FFFFFF" stroke="#CBD6DE" stroke-width="2"/>
  <text x="714.0" y="219.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">2. Ordenar A₁,...,Aₘ y sustituir</text>
  <text x="714.0" y="236.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Fase ascendente + fase descendente</text>
  <rect x="532" y="262" width="364" height="52" rx="9" fill="#204254" stroke="#121B22" stroke-width="2"/>
  <text x="714.0" y="284.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">n pasos para |w| = n</text>
  <text x="714.0" y="301.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#DCE7EE">Base de AFPN sin transiciones-λ</text>
</svg>
