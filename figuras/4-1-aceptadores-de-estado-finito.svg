  <text x="875" y="190" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#121B22">q2</text>
  <line x1="715" y1="185" x2="762" y2="185" stroke="#B94A3E" stroke-width="2.2" marker-end="url(#arrBrick)"/>
  <rect x="729.1" y="165.0" width="18.8" height="17" rx="4" fill="#FAF8F5" fill-opacity="0.92"/>
  <text x="738.5" y="177.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#B94A3E">λ</text>
  <line x1="805" y1="185" x2="852" y2="185" stroke="#B94A3E" stroke-width="2.2" marker-end="url(#arrBrick)"/>
  <rect x="819.1" y="165.0" width="18.8" height="17" rx="4" fill="#FAF8F5" fill-opacity="0.92"/>
  <text x="828.5" y="177.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#B94A3E">λ</text>
  <text x="784" y="265" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#B94A3E">Clausura-λ: E(q0) = {q0, q1, q2}</text>
  <text x="784" y="290" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#204254">AFN-λ ≡ AFN ≡ AFD</text>
</svg>
