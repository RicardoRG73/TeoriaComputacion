  <text x="100" y="190" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#121B22">q0</text>
  <circle cx="235" cy="185" r="22" fill="#FDF4F2" stroke="#B94A3E" stroke-width="2.2"/>
  <circle cx="235" cy="185" r="17" fill="none" stroke="#B94A3E" stroke-width="1.6"/>
  <text x="235" y="190" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#121B22">q1</text>
  <line x1="122" y1="185" x2="210" y2="185" stroke="#204254" stroke-width="2.2" marker-end="url(#arrSteel)"/>
  <rect x="129.4" y="165.0" width="73.19999999999999" height="17" rx="4" fill="#FAF8F5" fill-opacity="0.92"/>
