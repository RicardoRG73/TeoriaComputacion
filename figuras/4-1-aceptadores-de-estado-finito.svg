  <text x="480" y="275" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#121B22">Múltiples ramas posibles</text>
  <text x="480" y="298" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#4E606D">Acepta si ≥ 1 rama llega a F</text>
  <rect x="644" y="84" width="280" height="246" rx="10" fill="#FFFFFF" stroke="#121B22" stroke-width="1.8"/>
  <rect x="662" y="96" width="210" height="22" rx="11" fill="#121B22"/><text x="767.0" y="111" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">AFN-λ: Q × (Σ ∪ {λ}) → P(Q)</text>
  <line x1="641" y1="185" x2="672" y2="185" stroke="#B94A3E" stroke-width="2.2" marker-end="url(#arrBrick)"/>
  <circle cx="695" cy="185" r="20" fill="#EEF3F6" stroke="#204254" stroke-width="2.2"/>
  <text x="695" y="190" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#121B22">q0</text>
  <circle cx="785" cy="185" r="20" fill="#EEF3F6" stroke="#204254" stroke-width="2.2"/>
  <text x="785" y="190" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#121B22">q1</text>
  <circle cx="875" cy="185" r="20" fill="#FDF4F2" stroke="#B94A3E" stroke-width="2.2"/>
