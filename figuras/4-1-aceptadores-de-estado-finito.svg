  <rect x="358" y="96" width="155" height="22" rx="11" fill="#B94A3E"/><text x="435.5" y="111" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">AFN: Q × Σ → P(Q)</text>
