  <rect x="457.1" y="141.0" width="18.8" height="17" rx="4" fill="#FAF8F5" fill-opacity="0.92"/>
  <text x="466.5" y="153.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#B94A3E">1</text>
  <line x1="420" y1="196" x2="513" y2="222" stroke="#B94A3E" stroke-width="2.2" marker-end="url(#arrBrick)"/>
  <rect x="457.1" y="189.0" width="18.8" height="17" rx="4" fill="#FAF8F5" fill-opacity="0.92"/>
