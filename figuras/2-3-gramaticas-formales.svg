  <text x="707.5" y="287.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Toda cadena de L admite al menos una derivación S ⇒_G* w</text>
