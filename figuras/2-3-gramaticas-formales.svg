  <text x="28" y="54" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" fill="#4E606D">Reemplazo local uαv ⇒_G uβv y doble verificación: corrección + completitud</text>
