  <text x="252.5" y="287.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Toda cadena generada desde S cumple la regla de L (inducción en pasos k)</text>
