<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="2.4 Jerarquía de Chomsky: L₃ ⊊ L₂ ⊊ L₁ ⊊ L₀">
  <defs>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B94A3E"/>
      <stop offset="65%" stop-color="#204254"/>
      <stop offset="100%" stop-color="#121B22"/>
    </linearGradient>
    <marker id="arrSteel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#204254"/>
    </marker>
    <marker id="arrBrick" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#B94A3E"/>
    </marker>
    <marker id="arrInk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#121B22"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="360" rx="12" fill="#FAF8F5" stroke="#CBD6DE" stroke-width="1.5"/>
  <rect x="0" y="0" width="960" height="6" rx="3" fill="url(#topGrad)"/>
  <text x="28" y="34" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#121B22">2.4 Jerarquía de Chomsky: L₃ ⊊ L₂ ⊊ L₁ ⊊ L₀</text>
  <text x="28" y="54" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" fill="#4E606D">Cada nivel restringe las producciones y se corresponde con un modelo de autómata</text>
  <line x1="28" y1="64" x2="932" y2="64" stroke="#CBD6DE" stroke-width="1"/>
<rect x="40" y="82" width="540" height="254" rx="14" fill="#EEF3F6" stroke="#121B22" stroke-width="2"/>
  <text x="310" y="104" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#121B22">Tipo 0 · Sin restricción (L₀) — Máquina de Turing</text>
  <rect x="70" y="116" width="480" height="206" rx="12" fill="#E3ECF2" stroke="#204254" stroke-width="1.8"/>
  <text x="310" y="138" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#204254">Tipo 1 · Contexto sensitivo (L₁) — Autómata Linealmente Acotado</text>
  <rect x="102" y="150" width="416" height="158" rx="10" fill="#FDF4F2" stroke="#B94A3E" stroke-width="2"/>
  <text x="310" y="173" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#93362C">Tipo 2 · Libres del contexto (L₂) — Autómata con Pila (AP)</text>
  <rect x="138" y="186" width="344" height="106" rx="8" fill="#FFFFFF" stroke="#B94A3E" stroke-width="2"/>
  <text x="310" y="214" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#B94A3E">Tipo 3 · Regulares (L₃)</text>
  <text x="310" y="236" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#121B22">Autómata Finito (AFD / AFN)</text>
  <text x="310" y="258" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#4E606D">Testigo: a* b*</text>
  <rect x="608" y="86" width="314" height="54" rx="9" fill="#204254" stroke="#121B22" stroke-width="2"/>
  <text x="765.0" y="109.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Tipo 0: α → β (arbitraria)</text>
  <text x="765.0" y="126.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#DCE7EE">Permite borrar o acortar</text>
  <rect x="608" y="150" width="314" height="54" rx="9" fill="#EEF3F6" stroke="#204254" stroke-width="2"/>
  <text x="765.0" y="173.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">Tipo 1: |α| ≤ |β|</text>
  <text x="765.0" y="190.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Testigo: {a^n b^n c^n | n ≥ 1}</text>
  <rect x="608" y="214" width="314" height="54" rx="9" fill="#FDF4F2" stroke="#B94A3E" stroke-width="2"/>
  <text x="765.0" y="237.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">Tipo 2: A → α (A ∈ V)</text>
  <text x="765.0" y="254.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Testigo: {a^n b^n | n ≥ 0}</text>
  <rect x="608" y="278" width="314" height="54" rx="9" fill="#FFFFFF" stroke="#CBD6DE" stroke-width="2"/>
  <text x="765.0" y="301.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">Tipo 3: A → aB | λ</text>
  <text x="765.0" y="318.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Lineal derecha o izquierda</text>
</svg>
