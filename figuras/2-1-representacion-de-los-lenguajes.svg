  <text x="480.0" y="149.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4E606D">Gramática formal G = (V, Σ, P, S)</text>
  <rect x="655" y="90" width="250" height="92" rx="9" fill="#EEF3F6" stroke="#204254" stroke-width="2"/>
  <text x="780.0" y="132.0" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#121B22">3. Enfoque Reconocedor</text>
